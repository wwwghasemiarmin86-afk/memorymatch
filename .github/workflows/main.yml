name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  GODOT_VERSION: "4.2.2"

jobs:
  build-apk:
    name: Export debug APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot templates and Android settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/godot/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          cp -r /root/.config/godot/. ~/.config/godot/ || true

      - name: Import project
        run: godot --headless --verbose --import || true

      - name: Export APK
        run: |
          mkdir -v -p build
          godot --headless --verbose --export-debug "Android" build/MemoryMatch_by_Armin.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MemoryMatch-APK
          path: build/*.apk
